# PyPI packaging for `uvx claude-rate` / `pipx install claude-rate`.
#
# rate.py stays one stdlib-only file so the `curl ... | python -` one-liner keeps
# working; the wheel ships that same file as the `claude_rate` module. Keep the
# version in step with package.json and the --version string in rate.py: the
# release workflow refuses to publish when the three disagree.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "claude-rate"
version = "0.2.0"
description = "Grade a Claude Code setup for cost-efficiency, locally: score, fixes, and cache-aware monthly spend."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sagar Gupta" }]
keywords = ["claude", "claude-code", "anthropic", "cost", "audit", "llm", "prompt-caching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://sagargupta.online/claude-cost-optimizer/"
Source = "https://github.com/Sagargupta16/claude-cost-optimizer/tree/main/tools/claude-rate"
Issues = "https://github.com/Sagargupta16/claude-cost-optimizer/issues"
Changelog = "https://github.com/Sagargupta16/claude-cost-optimizer/blob/main/CHANGELOG.md"

[project.scripts]
claude-rate = "claude_rate:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"rate.py" = "claude_rate.py"

[tool.hatch.build.targets.sdist]
include = ["rate.py", "README.md", "pyproject.toml", "tests/"]
