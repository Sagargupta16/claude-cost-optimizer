# yaml-language-server: $schema=https://raw.githubusercontent.com/Sagargupta16/orrery/main/skills/orrery/references/diagram.schema.json
# Rendered with orrery (github.com/Sagargupta16/orrery):
#   orrery render docs/diagrams/build.yaml -o docs/diagrams/build -f svg --theme both
# Reviewed at README width: orrery review docs/diagrams/build.yaml --width 880
# Checked against the code: orrery verify docs/diagrams/build.yaml
title: How it is built and shipped
subtitle: One pricing source, a copy of the rates in every tool, checks on every pull request and a weekly alarm
direction: right
layout: { spacing: compact }
legend:
  dotted: Copied by hand from the sync checklist
  dashed: Read by a CI check

groups:
  tools: { type: zone, label: What users run }
  # check-rate-values.py compares six code copies with rate.py: the web tools, the MCP server, the extension,
  # estimate.py (its tokenizer_overhead too), cost-logger.sh and the retired usage analyzer's table, which
  # stays until the release that deletes tools/usage-analyzer/analyze.py and is not drawn. The skill carries its rates as prose.
  copies: { type: box, label: Code copies of the rates, in: tools, evidence: "scripts/check-rate-values.py#RATE_PY" }
  # ci.yml: the docs-consistency job and the output-trim fixture step run on every pull request; the site, ts-tools
  # and python-tools jobs also build and test the tools (not drawn). pricing-drift.yml runs weekly and by hand, never on a pull request.
  ci: { type: zone, label: "CI checks, one of them weekly", icon: logos:github-actions, evidence: [".github/workflows/ci.yml:171#docs-consistency", ".github/workflows/pricing-drift.yml:55#check-live-pricing.py"] }
  ship: { type: zone, label: How it reaches users }

nodes:
  # docs/pricing-data.md lists every file to update when a rate changes (Sync checklist).
  pricing: { icon: tabler:file-dollar, label: pricing-data.md, note: "docs/, source of truth", evidence: "docs/pricing-data.md:11#source of truth" }

  # Both CI checks and the weekly job take rate.py as canonical: its MODELS and _PRICING_VERIFIED_DATE.
  rate: { icon: logos:python, label: claude-rate, note: "rate.py, canonical", in: copies, evidence: "tools/claude-rate/rate.py#MODELS" }
  mcp: { icon: logos:model-context-protocol-icon, label: MCP cost server, note: TypeScript over stdio, in: copies, evidence: "tools/mcp-cost-server/src/index.ts:34#PRICING" }
  # The hook scripts are one node: cost-logger.sh holds the rates, output-trim.sh is replayed by CI, all of them ship from a clone.
  hooks: { icon: tabler:webhook, label: Hooks, note: "cost-logger.sh has the rates", in: copies, evidence: ["hooks/cost-logger.sh:58#COST_LOGGER_MODEL", "hooks/output_trim.py#updatedToolOutput"] }
  estimator: { icon: tabler:ruler-measure, label: Token estimator, note: "estimate.py, rates and tokenizer", in: copies, evidence: "tools/token-estimator/estimate.py#MODEL_PRICING" }
  vscode: { icon: logos:visual-studio-code, label: VS Code extension, note: not on Marketplace, in: copies, evidence: "tools/vscode-extension/src/costEstimator.ts:21#PRICING" }
  web: { icon: logos:react, label: Web tools, note: site/src/utils/pricing.ts, in: copies, evidence: "site/src/utils/pricing.ts:145#MODELS" }
  skill: { icon: tabler:puzzle, label: cost-mode skill, note: rates in prose, in: tools, evidence: "skills/cost-mode/SKILL.md:2#cost-mode" }

  sync: { icon: tabler:calendar-check, label: check-pricing-sync.py, note: every stamp vs rate.py, in: ci, evidence: ".github/workflows/ci.yml:186#check-pricing-sync.py" }
  links: { icon: tabler:link, label: check-links.py, note: every .md file, in: ci, evidence: ".github/workflows/ci.yml:199#check-links.py" }
  values: { icon: github:git-compare, label: check-rate-values.py, note: every copy vs rate.py, in: ci, evidence: ".github/workflows/ci.yml:192#check-rate-values.py" }
  trimcheck: { icon: tabler:flask, label: eval-output-filter.py, note: output-trim vs fixtures, in: ci, evidence: ".github/workflows/ci.yml:154#eval-output-filter.py" }
  # Fetches Anthropic's pricing page, compares every rate with MODELS and opens or updates one "Live pricing drift" issue.
  drift: { icon: tabler:alarm, label: check-live-pricing.py, note: "weekly, opens an issue on drift", in: ci, evidence: ".github/workflows/pricing-drift.yml:55#check-live-pricing.py" }
  page: { icon: logos:anthropic-icon, label: Anthropic pricing page, note: platform.claude.com, evidence: "scripts/check-live-pricing.py#PRICING_URL" }

  # claude-rate streams from raw.githubusercontent.com; the MCP server, the extension, the estimator and the hooks come from a clone.
  repo: { icon: github:repo, label: GitHub repo, note: "main branch", in: ship, evidence: ["README.md#raw.githubusercontent.com", "tools/mcp-cost-server/README.md:20#claude mcp add", "tools/vscode-extension/README.md:15#not yet published", "hooks/README.md#Clone or download this repo"] }
  pages: { icon: si:githubpages, label: GitHub Pages, note: deploy-site.yml, in: ship, evidence: ".github/workflows/deploy-site.yml:46#deploy-pages" }
  plugin: { icon: logos:claude-icon, label: Claude Code plugin, note: .claude-plugin/, in: ship, evidence: ".claude-plugin/marketplace.json:9#cost-mode" }
  codex: { icon: logos:codex, label: Codex plugin, note: .agents/plugins/, in: ship, evidence: ".agents/plugins/marketplace.json:11#./plugins/cost-mode" }
  npx: { icon: logos:npm-icon, label: npx skills add, note: "Cursor, Cline, Codex", in: ship, evidence: "README.md#npx skills add" }

edges:
  - pricing ..> tools: sync checklist
  - pricing --> sync: stamps, retirements
  - pricing --> links: links, anchors
  - copies --> values: compared with rate.py
  - { from: hooks, to: trimcheck, label: replayed on fixtures, line: dashed, evidence: "scripts/eval-output-filter.py#FIXTURES" }
  - { from: rate, to: drift, label: MODELS, line: dashed, evidence: "scripts/check-live-pricing.py#_PRICE_ALIASES" }
  - { from: page, to: drift, label: pricing tables, line: dashed, evidence: "scripts/check-live-pricing.py#PRICING_URL" }
  - rate -> repo: raw file into python -
  - mcp -> repo: clone, pnpm build
  - vscode -> repo: clone, VSIX build
  - { from: estimator, to: repo, label: "clone, run", evidence: "tools/token-estimator/README.md#python tools/token-estimator/estimate.py" }
  - { from: hooks, to: repo, label: "clone, settings.json", evidence: "hooks/README.md#Clone or download this repo" }
  - web -> pages: on push to main
  - skill -> plugin: /plugin install
  - skill ..> codex: copy in plugins/
  - skill -> npx: reads skills/
