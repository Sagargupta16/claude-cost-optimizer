<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="544" viewBox="0 0 1120 544" role="img" aria-labelledby="tf-t tf-d">
<title id="tf-t">One Claude Code turn, billed</title>
<desc id="tf-d">Animated diagram of how one Claude Code turn is billed, using Sonnet 5.5 prices per 1 million tokens. In turn N the stable prefix (system prompt, CLAUDE.md, tool names) and earlier history are read from the prompt cache at 0.05x base input, $0.10. The fresh input is billed at 1x, $2. The model's output is billed at 5x, $10. In turn N+1 the fresh input and output of turn N join the history and are read from cache at the cache-read rate, and a new fresh input arrives. Cache read is 0.1x of base input on most models, 0.05x on Opus 5.5 and Sonnet 5.5, and 0.025x on Fable 5.1 and Mythos 5.1. Cache writes are not drawn.</desc>
