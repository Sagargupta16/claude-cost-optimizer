<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="544" aria-labelledby="tf-t tf-d" role="img" viewBox="0 0 1120 544"><title id="tf-t">One Claude Code turn, billed</title><desc id="tf-d">Animated diagram of how one Claude Code turn is billed, using Sonnet 5.5 prices per 1 million tokens. In turn N the stable prefix (system prompt, CLAUDE.md, tool names) and earlier history are read from the prompt cache at 0.05x base input, $0.10. The fresh input is billed at 1x, $2. The model&apos;s output is billed at 5x, $10. In turn N+1 the fresh input and output of turn N join the history and are read from cache at the cache-read rate, and a new fresh input arrives. Cache read is 0.1x of base input on most models, 0.05x on Opus 5.5 and Sonnet 5.5, and 0.025x on Fable 5.1 and Mythos 5.1. Cache writes are not drawn.</desc><style>@keyframes k0{0%{opacity:0;transform:translate(0,-6px)}2%{opacity:0;transform:translate(0,-6px);animation-timing-function:cubic-bezier(.22,1,.36,1)}5.33%{opacity:1;transform:translate(0,0)}}@keyframes k1{0%{opacity:0;transform:translate(0,12px)}3.33%{opacity:0;transform:translate(0,12px);animation-timing-function:cubic-bezier(.22,1,.36,1)}6.67%{opacity:1;transform:translate(0,0)}}@keyframes k2{0%{opacity:0;transform:translate(0,12px)}5.33%{opacity:0;transform:translate(0,12px);animation-timing-function:cubic-bezier(.22,1,.36,1)}8.67%{opacity:1;transform:translate(0,0)}}@keyframes k3{0%{opacity:0;transform:translate(0,12px)}7.33%{opacity:0;transform:translate(0,12px);animation-timing-function:cubic-bezier(.22,1,.36,1)}10.67%{opacity:1;transform:translate(0,0)}}@keyframes k4{0%{opacity:0;transform:translate(0,12px)}10%{opacity:0;transform:translate(0,12px);animation-timing-function:cubic-bezier(.22,1,.36,1)}13.33%{opacity:1;transform:translate(0,0)}}@keyframes k5{0%{opacity:0;transform:translate(0,12px)}12.67%{opacity:0;transform:translate(0,12px);animation-timing-function:cubic-bezier(.22,1,.36,1)}16%{opacity:1;transform:translate(0,0)}}@keyframe