<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="ml-t ml-d">
<title id="ml-t">Price per 1M tokens</title>
<desc id="ml-d">Animated price ladder on a log scale from $0.10 to $50 per 1M tokens. Each model shows an input dot and an output dot; output is 5x input on every model. Haiku 5.5 costs $0.10 input and $0.50 output for prompts up to 100K tokens, and $0.50 input and $2.50 output above 100K, priced on the whole request. Sonnet 5.5 costs $2 and $10. Opus 5.5 costs $4 and $20. Fable 5.1 costs $10 and $50. A marker sliding across the 100K tick shows Haiku 5.5's price stepping up 5x.</desc>
