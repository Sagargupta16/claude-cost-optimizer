<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" aria-labelledby="cm-t cm-d" role="img" viewBox="0 0 900 500"><title id="cm-t">Cache read price as a share of base input</title><desc id="cm-d">Animated bar chart. A prompt-cache read costs a fixed share of a model&apos;s base input price per 1M tokens. At 0.1x, which covers most models: Haiku 5.5 $0.01 of $0.10 up to 100K prompt tokens and $0.05 of $0.50 over 100K, Sonnet 5 $0.20 of $2, Opus 5 $0.50 of $5, Fable 5 $1 of $10. At 0.05x: Opus 5.5 $0.20 of $4 and Sonnet 5.5 $0.10 of $2. At 0.025x: Fable 5.1 and Mythos 5.1, $0.25 of $10 each. The bar axis runs from 0 to 0.1x.</desc><style>@keyframes k0{0%{opacity:0;transform:translate(-16px,0)}4.44%{opacity:0;transform:translate(-16px,0);animation-timing-function:cubic-bezier(.22,1,.36,1)}10%{opacity:1;transform:translate(0,0)}}@keyframes k1{0%{transform:scaleX(0)}5.56%{transform:scaleX(0);animation-timing-function:cubic-bezier(.22,1,.36,1)}17.78%{transform:scaleX(1)}}@keyframes k2{0%{opacity:0;transform:translate(0,8px)}15.56%{opacity:0;transform:translate(0,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}20.56%{opacity:1;transform:translate(0,0)}}@keyframes k3{0%{opacity:0;transform:translate(0,8px)}17.11%{opacity:0;transform:translate(0,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}22.11%{opacity:1;transform:translate(0,0)}}@keyframes k4{0%{opacity:0;transform:translate(0,8px)}18.67%{opacity:0;transform:translate(0,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}23.67%{opacity:1;transform:translate(0,0)}}@keyframes k5{0%{opacity:0;transform:translate(0,8px)}20.22%{opacity:0;transform:translate(0,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}25.22%{opacity:1;transform:translate(0,0)}}@keyframes k6{0%{opacity:0;transform:translate(0,8px)}21.78%{opacity:0;transform:translate(0,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}26.78%{opacity:1;transform:translate(0,0)}}@keyframes k7{0%{opacity:0;transform:translate(0,8px)}23.33%{opacity:0;transform:translate(0,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}28.33%{opacity:1;transform:translate(0,0)}}@keyframes k8{0%{opacity:0;transform:translate(-16px,0)}14.44%{opacity:0;transform:translate(-16px,0);animation-timing-function:cubic-bezier(.22,1,.36,1)}20%{opacity:1;transform:translate(0,0)}}@keyframes k9{0%{transform:scaleX(0)}15.56%{transform:scaleX(0);animation-timing-function:cubic-bezier(.22,1,.36,1)}27.78%{transform:scaleX(1)}}@keyframes k10{0%{opacity:0;transform:translate(0,8px)}25.56%{opacity:0;transform:translate(0,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}30.56%{opacity:1;transform:translate(0,0)}}@keyframes k11{0%{opacity:0;transform:translate(0,8px)}27.11%{opacity:0;transform:translate(0,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}32.11%{opacity:1;transform:translate(0,0)}}@keyframes k12{0%{opacity:0;transform:translate(-16px,0)}24.44%{opacity:0;transform:translate(-16px,0);animation-timing-function:cubic-bezier(.22,1,.36,1)}30%{opacity:1;transform:translate(0,0)}}@keyframes k13{0%{transform:scaleX(0)}25.56%{transform:scaleX(0);animation-timing-function:cubic-bezier(.22,1,.36,1)}37.78%{transform:scaleX(1)}}@keyframes k14{0%{opacity:0;transform:translate(0,8px)}35.56%{opacity:0;transform:translate(0,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}40.56%{opacity:1;transform:translate(0,0)}}@keyframes k15{0%{opacity:0;transform:translate(0,8px)}37.11%{opacity:0;transform:translate(0,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}42.11%{opacity:1;transform:translate(0,0)}}@keyframes kstage{0%,84.44%{opacity:1}93.33%{opacity:0}}text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Noto Sans&apos;,Helvetica,Arial,sans-serif}.b{font-weight:700}.t{fill:#e6edf3}.m{fill:#8b949e}.k0{animation:k0 9s linear infinite}.k1{animation:k1 9s linear infinite}.k2{animation:k2 9s linear infinite}.k3{animation:k3 9s linear infinite}.k4{animation:k4 9s linear infinite}.k5{animation:k5 9s linear infinite}.k6{animation:k6 9s linear infinite}.k7{animation:k7 9s linear infinite}.k8{animation:k8 9s linear infinite}.k9{animation:k9 9s linear infinite}.k10{animation:k10 9s linear infinite}.k11{animation:k11 9s linear infinite}.k12{animation:k12 9s linear infinite}.k13{animation:k13 9s linear infinite}.k14{animation:k14 9s linear infinite}.k15{animation:k15 9s linear infinite}.kstage{animation:kstage 9s linear infinite}</style><rect width="899" height="499" x=".5" y=".5" fill="#161b22" stroke="#30363d" rx="12"/><text x="40" y="54" class="b t" font-size="34">Cache read price as a share of base input</text><text x="40" y="86" class="m" font-size="22">Bars use an axis of 0 to 0.1x of base input. Per 1M tokens.</text><rect width="628" height="34" x="232" y="110" fill="#58a6ff" fill-opacity=".16" rx="6"/><rect width="628" height="34" x="232" y="272" fill="#58a6ff" fill-opacity=".16" rx="6"/><rect width="628" height="34" x="232" y="368" fill="#58a6ff" fill-opacity=".16" rx="6"/><g class="kstage"><text x="40" y="144" class="k0 b t" font-size="50">0.1x</text><rect class="k1" style="transform-box:fill-box;transform-origin:left center" width="628" height="34" x="232" y="110" fill="#388bfd" rx="6"/><text x="40" y="176" class="k2" font-size="24"><tspan class="t">Haiku 5.5 up to 100K</tspan><tspan fill="#79c0ff" dx="12" font-weight="700">$0.01</tspan><tspan class="m" dx="6">/ $0.10</tspan></text><text x="470" y="176" class="k3" font-size="24"><tspan class="t">Sonnet 5</tspan><tspan fill="#79c0ff" dx="12" font-weight="700">$0.20</tspan><tspan class="m" dx="6">/ $2</tspan></text><text x="40" y="208" class="k4" font-size="24"><tspan class="t">Haiku 5.5 over 100K</tspan><tspan fill="#79c0ff" dx="12" font-weight="700">$0.05</tspan><tspan class="m" dx="6">/ $0.50</tspan></text><text x="470" y="208" class="k5" font-size="24"><tspan class="t">Opus 5</tspan><tspan fill="#79c0ff" dx="12" font-weight="700">$0.50</tspan><tspan class="m" dx="6">/ $5</tspan></text><text x="40" y="240" class="k6 m" font-size="24">and every older model</text><text x="470" y="240" class="k7" font-size="24"><tspan class="t">Fable 5</tspan><tspan fill="#79c0ff" dx="12" font-weight="700">$1</tspan><tspan class="m" dx="6">/ $10</tspan></text><text x="40" y="306" class="k8 b t" font-size="50">0.05x</text><rect class="k9" style="transform-box:fill-box;transform-origin:left center" width="314" height="34" x="232" y="272" fill="#58a6ff" rx="6"/><text x="40" y="338" class="k10" font-size="24"><tspan class="t">Opus 5.5</tspan><tspan fill="#79c0ff" dx="12" font-weight="700">$0.20</tspan><tspan class="m" dx="6">/ $4</tspan></text><text x="470" y="338" class="k11" font-size="24"><tspan class="t">Sonnet 5.5</tspan><tspan fill="#79c0ff" dx="12" font-weight="700">$0.10</tspan><tspan class="m" dx="6">/ $2</tspan></text><text x="40" y="402" class="k12 b t" font-size="50">0.025x</text><rect class="k13" style="transform-box:fill-box;transform-origin:left center" width="157" height="34" x="232" y="368" fill="#79c0ff" rx="6"/><text x="40" y="434" class="k14" font-size="24"><tspan class="t">Fable 5.1</tspan><tspan fill="#79c0ff" dx="12" font-weight="700">$0.25</tspan><tspan class="m" dx="6">/ $10</tspan></text><text x="470" y="434" class="k15" font-size="24"><tspan class="t">Mythos 5.1</tspan><tspan fill="#79c0ff" dx="12" font-weight="700">$0.25</tspan><tspan class="m" dx="6">/ $10</tspan></text></g><text x="40" y="476" class="m" font-size="18">Each entry: model, cache read price / base input price.</text></svg>