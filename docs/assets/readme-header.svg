<title id="rh-t">Claude Cost Optimizer</title>
<desc id="rh-d">Repository header for Claude Cost Optimizer, an installable skill, CLI tools and guides for lowering Claude Code costs through prompt caching, model routing and context discipline. Animated token bars slide along three lanes into a box labelled prompt cache.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.b{font-weight:700}.t{fill:#e6edf3}.m{fill:#8b949e}.ac{fill:#79c0ff}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.tt{font-weight:800;letter-spacing:-1px}.ey{letter-spacing:3px}</style>
