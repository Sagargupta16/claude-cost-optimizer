<text class="k2" x="40" y="176" font-size="24"><tspan class="t">Haiku 5.5 up to 100K</tspan><tspan dx="12" fill="#79c0ff" font-weight="700">$0.01</tspan><tspan class="m" dx="6">/ $0.10</tspan></text>
<text class="k3" x="470" y="176" font-size="24"><tspan class="t">Sonnet 5</tspan><tspan dx="12" fill="#79c0ff" font-weight="700">$0.20</tspan><tspan class="m" dx="6">/ $2</tspan></text>
<text class="k4" x="40" y="208" font-size="24"><tspan class="t">Haiku 5.5 over 100K</tspan><tspan dx="12" fill="#79c0ff" font-weight="700">$0.05</tspan><tspan class="m" dx="6">/ $0.50</tspan></text>
<text class="k5" x="470" y="208" font-size="24"><tspan class="t">Opus 5</tspan><tspan dx="12" fill="#79c0ff" font-weight="700">$0.50</tspan><tspan class="m" dx="6">/ $5</tspan></text>
<text class="k6 m" x="40" y="240" font-size="24">and every older model</text>
<text class="k7" x="470" y="240" font-size="24"><tspan class="t">Fable 5</tspan><tspan dx="12" fill="#79c0ff" font-weight="700">$1</tspan><tspan class="m" dx="6">/ $10</tspan></text>
<text class="k8 b t" x="40" y="306" font-size="50">0.05x</text>
<rect class="k9" style="transform-box:fill-box;transform-origin:left center" x="232" y="272" width="314" height="34" rx="6" fill="#58a6ff"/>
<text class="k10" x="40" y="338" font-size="24"><tspan class="t">Opus 5.5</tspan><tspan dx="12" fill="#79c0ff" font-weight="700">$0.20</tspan><tspan class="m" dx="6">/ $4</tspan></text>
<text class="k11" x="470" y="338" font-size="24"><tspan class="t">Sonnet 5.5</tspan><tspan dx="12" fill="#79c0ff" font-weight="700">$0.10</tspan><tspan class="m" dx="6">/ $2</tspan></text>
<text class="k12 b t" x="40" y="402" font-size="50">0.025x</text>
