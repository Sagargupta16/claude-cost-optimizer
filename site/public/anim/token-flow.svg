ity="0" rx="3"/><rect width="20" height="9" x="662" y="214" fill="#a5d6ff" class="k12" opacity="0" rx="3"/><rect width="20" height="9" x="662" y="228" fill="#a5d6ff" class="k13" opacity="0" rx="3"/><g class="k15"><rect width="112" height="84" x="962" y="176" fill="#a5d6ff" stroke="#a5d6ff" stroke-width="1.5" rx="6"/><text x="1018" y="226" fill="#0d1117" font-size="24" font-weight="700" text-anchor="middle">output</text></g><g class="k16"><path fill="none" stroke="#a5d6ff" stroke-dasharray="130" stroke-linejoin="round" stroke-width="3" d="M962 168 V162 H1074 V168"/><text x="1018" y="150" fill="#a5d6ff" text-anchor="middle"><tspan font-size="40" font-weight="700">5x</tspan><tspan dx="8" font-size="24" font-weight="700">$10</tspan></text></g><text x="40" y="362" class="b t k17" font-size="28">TURN N+1</text><g class="k18"><rect width="118" height="84" x="40" y="388" fill="#1b4478" stroke="#388bfd" stroke-width="1.5" rx="6"/><text x="99" y="426" fill="#e6edf3" font-size="24" font-weight="700" text-anchor="middle">system</text><text x="99" y="452" fill="#e6edf3" font-size="24" font-weight="700" text-anchor="middle">prompt</text><rect width="150" height="84" x="162" y="388" fill="#1b4478" stroke="#388bfd" stroke-width="1.5" rx="6"/><text x="237" y="438" fill="#e6edf3" font-size="24" font-weight="700" text-anchor="middle">CLAUDE.md</text><rect width="98" height="84" x="316" y="388" fill="#1b4478" stroke="#388bfd" stroke-width="1.5" rx="6"/><text x="365" y="426" fill="#e6edf3" font-size="24" font-weight="700" text-anchor="middle">tool</text><text x="365" y="452" fill="#e6edf3" font-size="24" font-weight="700" text-anchor="middle">names</text></g><g class="k19"><rect width="130" height="84" x="418" y="388" fill="#1b4478" stroke="#388bfd" stroke-width="1.5" rx="6"/><text x="483" y="438" fill="#e6edf3" font-size="24" font-weight="700" text-anchor="middle">history</text></g><g class="k20"><rect width="100" height="84" x="552" y="388" fill="#1b4478" stroke="#388bfd" stroke-width