<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="cm-t cm-d">
<title id="cm-t">Cache read price as a share of base input</title>
<desc id="cm-d">Animated bar chart. A prompt-cache read costs a fixed share of a model's base input price per 1M tokens. At 0.1x, which covers most models: Haiku 5.5 $0.01 of $0.10 up to 100K prompt tokens and $0.05 of $0.50 over 100K, Sonnet 5 $0.20 of $2, Opus 5 $0.50 of $5, Fable 5 $1 of $10. At 0.05x: Opus 5.5 $0.20 of $4 and Sonnet 5.5 $0.10 of $2. At 0.025x: Fable 5.1 and Mythos 5.1, $0.25 of $10 each. The bar axis runs from 0 to 0.1x.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.b{font-weight:700}.t{fill:#e6edf3}.m{fill:#8b949e}.ac{fill:#79c0ff}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes k0{0%{opacity:0;transform:translate(-16px,0px)}4.44%{opacity:0;transform:translate(-16px,0px);animation-timing-function:cubic-bezier(.22,1,.36,1)}10%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k0{animation:k0 9s linear infinite}@keyframes k1{0%{transform:scaleX(0)}5.56%{transform:scaleX(0);animation-timing-function:cubic-bezier(.22,1,.36,1)}17.78%{transform:scaleX(1)}100%{transform:scaleX(1)}}.k1{animation:k1 9s linear infinite}@keyframes k2{0%{opacity:0;transform:translate(0px,8px)}15.56%{opacity:0;transform:translate(0px,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}20.56%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k2{animation:k2 9s linear infinite}@keyframes k3{0%{opacity:0;transform:translate(0px,8px)}17.11%{opacity:0;transform:translate(0px,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}22.11%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k3{animation:k3 9s linear infinite}@keyframes k4{0%{opacity:0;transform:translate(0px,8px)}18.67%{opacity:0;transform:translate(0px,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}23.67%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k4{animation:k4 9s linear infinite}@keyframes k5{0%{opacity:0;transform:translate(0px,8px)}20.22%{opacity:0;transform:translate(0px,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}25.22%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k5{animation:k5 9s linear infinite}@keyframes k6{0%{opacity:0;transform:translate(0px,8px)}21.78%{opacity:0;transform:translate(0px,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}26.78%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k6{animation:k6 9s linear infinite}@keyframes k7{0%{opacity:0;transform:translate(0px,8px)}23.33%{opacity:0;transform:translate(0px,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}28.33%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k7{animation:k7 9s linear infinite}@keyframes k8{0%{opacity:0;transform:translate(-16px,0px)}14.44%{opacity:0;transform:translate(-16px,0px);animation-timing-function:cubic-bezier(.22,1,.36,1)}20%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k8{animation:k8 9s linear infinite}@keyframes k9{0%{transform:scaleX(0)}15.56%{transform:scaleX(0);animation-timing-function:cubic-bezier(.22,1,.36,1)}27.78%{transform:scaleX(1)}100%{transform:scaleX(1)}}.k9{animation:k9 9s linear infinite}@keyframes k10{0%{opacity:0;transform:translate(0px,8px)}25.56%{opacity:0;transform:translate(0px,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}30.56%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k10{animation:k10 9s linear infinite}@keyframes k11{0%{opacity:0;transform:translate(0px,8px)}27.11%{opacity:0;transform:translate(0px,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}32.11%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k11{animation:k11 9s linear infinite}@keyframes k12{0%{opacity:0;transform:translate(-16px,0px)}24.44%{opacity:0;transform:translate(-16px,0px);animation-timing-function:cubic-bezier(.22,1,.36,1)}30%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k12{animation:k12 9s linear infinite}@keyframes k13{0%{transform:scaleX(0)}25.56%{transform:scaleX(0);animation-timing-function:cubic-bezier(.22,1,.36,1)}37.78%{transform:scaleX(1)}100%{transform:scaleX(1)}}.k13{animation:k13 9s linear infinite}@keyframes k14{0%{opacity:0;transform:translate(0px,8px)}35.56%{opacity:0;transform:translate(0px,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}40.56%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k14{animation:k14 9s linear infinite}@keyframes k15{0%{opacity:0;transform:translate(0px,8px)}37.11%{opacity:0;transform:translate(0px,8px);animation-timing-function:cubic-bezier(.22,1,.36,1)}42.11%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}.k15{animation:k15 9s linear infinite}@keyframes kstage{0%,84.44%{opacity:1}93.33%,100%{opacity:0}}.kstage{animation:kstage 9s linear infinite}</style>
